<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Orca Deck">
<title>Orca Deck</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3l14 9-14 9z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect width="14" height="14" x="5" y="5" rx="2"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4v16M5.07 8l13.86 8M5.07 16l13.86-8"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></symbol>
  <symbol id="i-pr" viewBox="0 0 24 24"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7M6 9v12"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></symbol>
</svg>
<main>
  <section id="pair">
    <h1>Orca Deck</h1>
    <form id="pairForm"><label for="pin" data-t="pinLabel">Mã ghép nối</label><input id="pin" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="off" required><button type="submit" class="primary" data-t="connect">Kết nối</button></form>
    <button type="button" class="icon-button lang-button" data-ta="language" aria-label="Ngôn ngữ"><svg class="icon"><use xlink:href="#i-globe"/></svg><span class="lang-code"></span></button>
  </section>
  <div id="deck" hidden>
    <header id="bar">
      <span id="dot" role="img" aria-label="Chưa kết nối"></span>
      <button id="agentButton" class="agent-button" data-ta="chooseAgent" aria-label="Chọn agent"><span><strong id="agentTitle">Chọn agent</strong><small id="project"></small></span><svg class="icon"><use xlink:href="#i-down"/></svg></button>
      <button id="linksButton" class="icon-button" data-ta="links" aria-label="Đặt liên kết"><svg class="icon"><use xlink:href="#i-link"/></svg></button>
      <button id="editButton" class="icon-button" data-ta="editLayout" aria-label="Sửa bố cục"><svg class="icon"><use xlink:href="#i-grid"/></svg></button>
    </header>
    <header id="editBar" hidden>
      <button id="moveLeft" class="icon-button" data-ta="moveLeft" aria-label="Chuyển trước"><svg class="icon"><use xlink:href="#i-left"/></svg></button>
      <button id="moveRight" class="icon-button" data-ta="moveRight" aria-label="Chuyển sau"><svg class="icon"><use xlink:href="#i-right"/></svg></button>
      <button id="toggleKey" class="icon-button" data-ta="toggleKey" aria-label="Ẩn / hiện nút"><svg class="icon"><use xlink:href="#i-eye"/></svg></button>
      <span class="spacer"></span>
      <button type="button" class="icon-button lang-button" data-ta="language" aria-label="Ngôn ngữ"><svg class="icon"><use xlink:href="#i-globe"/></svg><span class="lang-code"></span></button>
      <button id="resetLayout" class="icon-button" data-ta="reset" aria-label="Bố cục mặc định"><svg class="icon"><use xlink:href="#i-reset"/></svg></button>
      <button id="unpair" class="icon-button danger" data-ta="unpair" aria-label="Ngắt ghép nối"><svg class="icon"><use xlink:href="#i-logout"/></svg></button>
      <button id="editDone" class="primary" data-t="done">Xong</button>
    </header>
    <section id="request" class="request" hidden>
      <div class="request-heading"><strong id="requestTool"></strong><span id="requestMeta"></span><span id="requestCount" class="badge"></span></div>
      <label class="sr-only" for="requestSelect" data-t="chooseRequest">Chọn yêu cầu</label><select id="requestSelect"></select>
      <pre id="requestInput"></pre>
      <div id="cardActions" class="card-actions"><button id="cardApprove" class="approve" data-ta="approveOnce" aria-label="Duyệt một lần" disabled>Approve</button><button id="cardReject" class="reject" data-ta="rejectOne" aria-label="Từ chối" disabled>Reject</button></div>
    </section>
    <section id="agentsView" class="view" hidden><div id="agentsList" class="list"></div></section>
    <section id="agentView" class="view" hidden></section>
    <section id="keys" class="keys" data-ta="deck" aria-label="Bảng điều khiển">
      <button id="approve" class="key approve" data-ta="approveOnce" aria-label="Duyệt một lần" disabled><svg class="icon"><use xlink:href="#i-check"/></svg><strong>Approve</strong></button>
      <button id="reject" class="key reject" data-ta="rejectOne" aria-label="Từ chối" disabled><svg class="icon"><use xlink:href="#i-x"/></svg><strong>Reject</strong></button>
      <button id="continue" class="key" disabled><svg class="icon"><use xlink:href="#i-play"/></svg><strong>Continue</strong></button>
      <button id="interrupt" class="key" disabled><svg class="icon"><use xlink:href="#i-stop"/></svg><strong>Interrupt</strong></button>
      <button id="mainClaude" class="key"><svg class="icon"><use xlink:href="#i-star"/></svg><strong data-t="mainClaude">Claude chính</strong></button>
      <button id="choose" class="key"><svg class="icon"><use xlink:href="#i-swap"/></svg><strong>Agent</strong></button>
      <button id="pr" class="key" data-ta="openPr" aria-label="Mở PR" disabled><svg class="icon"><use xlink:href="#i-pr"/></svg><strong>PR</strong></button>
      <button id="preview" class="key" data-ta="openPreview" aria-label="Mở preview" disabled><svg class="icon"><use xlink:href="#i-monitor"/></svg><strong>Preview</strong></button>
    </section>
    <nav id="tabs" class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="agents"><svg class="icon"><use xlink:href="#i-list"/></svg><span data-t="tabAgents">Tất cả</span></button>
      <button class="tab" role="tab" data-view="agent"><svg class="icon"><use xlink:href="#i-terminal"/></svg><span>Agent</span></button>
      <button class="tab" role="tab" data-view="deck"><svg class="icon"><use xlink:href="#i-grid"/></svg><span>Deck</span></button>
    </nav>
  </div>
  <p id="message" role="status" aria-live="polite"></p>
</main>
<div id="agentModal" class="modal" hidden><section class="modal-card"><div class="modal-heading"><h2>Agent</h2><button class="icon-button close" data-ta="close" aria-label="Đóng"><svg class="icon"><use xlink:href="#i-x"/></svg></button></div><div id="agentList"></div></section></div>
<div id="linksModal" class="modal" hidden><section class="modal-card"><div class="modal-heading"><h2 data-t="linksTitle">Liên kết</h2><button class="icon-button close" data-ta="close" aria-label="Đóng"><svg class="icon"><use xlink:href="#i-x"/></svg></button></div><form id="linksForm"><label for="prUrl">PR</label><input id="prUrl" type="url" placeholder="https://github.com/…/pull/…"><label for="previewUrl">Preview</label><input id="previewUrl" type="url" placeholder="http://localhost:3000"><button type="submit" class="primary" data-t="save">Lưu</button></form></section></div>
<script src="/app.js"></script>
</body></html>
